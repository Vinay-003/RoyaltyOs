# Free-tier blueprint: ONE web service (API + worker via npm run start:free).
# Render free has no background workers or private services, so:
# - NODE_ENV=staging (production would fail-closed contract uploads without ClamAV)
# - MALWARE_SCAN_MODE=disabled (Sandbox/demo only; see render.paid.yaml for prod)
# - the outbox worker runs in-process-group alongside the API (scripts/start-free.mjs)
# Paid three-service layout (api + worker + private ClamAV) is kept in render.paid.yaml.
services:
  - type: web
    name: royaltyos-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run start:free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: staging
      - key: APP_VERSION
        value: 1.0.2
      - key: APP_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: royaltyos-contracts
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_CREDENTIALS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: PAYPAL_AI_ENABLED
        value: true
      - key: PAYPAL_MCP_SERVER_URL
        value: https://mcp.sandbox.paypal.com/http
      - key: MALWARE_SCAN_MODE
        value: disabled
      - key: CORS_ORIGINS
        sync: false
      - key: FRAME_ANCESTORS
        sync: false
