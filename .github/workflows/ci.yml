name: RoyaltyOS CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck, migration shape, tests, build
        run: npm run verify
      - name: Upload verification logs when present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: royaltyos-verification
          path: reports/*.txt
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Filesystem scan (no git history range): the gitleaks-action git-range
      # mode fails on fresh repositories because the root commit has no parent
      # for the `base^..head` range. A fresh checkout contains no .env, so a
      # working-tree scan is both sufficient and range-bug immune.
      - name: Gitleaks filesystem scan
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git --redact -v --exit-code 1

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
