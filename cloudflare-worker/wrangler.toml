name = "royaltyos-supabase-keepalive"
main = "worker.js"
compatibility_date = "2024-01-01"

# Crons:
# 1. "0 0 */3 * *" -> Every 3 days at midnight UTC: inserts keepalive ping
# 2. "5 0 */3 * *" -> Every 3 days at 00:05 UTC (5 mins later): cleans up the ping
[triggers]
crons = ["0 0 */3 * *", "5 0 */3 * *"]

# Set secrets via:
# wrangler secret put SUPABASE_URL
# wrangler secret put SUPABASE_SECRET_KEY
# wrangler secret put MANUAL_TRIGGER_TOKEN
